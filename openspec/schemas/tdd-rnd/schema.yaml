name: tdd-rnd
version: 1
description: TDD workflow with a research artifact - research → proposal → specs → architecture → tests → tasks
artifacts:
  - id: research
    generates: research.md
    description: Facts, source material, and external research this change rests on
    template: research.md
    instruction: >
      Record what is KNOWN before deciding anything. This artifact is the evidence the
      proposal and architecture will rest on.


      Sections:

      - **Source material**: verbatim notes from meetings, the PI, collaborators. Dated
      and attributed. Quote in full rather than paraphrasing so a later reader can audit
      whether the requirements were a fair reading. Include a "Raised but not acted on"
      subsection — what was mentioned and deliberately skipped, and why.

      - **Glossary**: domain terms, acronyms, and any word used in a non-obvious sense,
      each with a "Does NOT mean" column. Add an entry the moment a term could be read
      two ways. This is the primary defence against an implementer inferring nomenclature
      and carrying the wrong inference into code.

      - **External research**: reference implementations, papers, standards, taxonomies.
      Record the LICENCE wherever code is involved and the date accessed. Record failed
      lookups too, so nobody re-runs a dead end.

      - **Candidate tech**: packages, frameworks, stacks considered — adopted AND
      rejected, each with a reason and a date.

      - **Patterns adopted**: techniques taken from external sources, with attribution
      and where they land in this codebase.

      - **Verified facts**: a table of claims with the method that settled each one.

      - **Unverified assumptions**: believed but unchecked, with what checking costs.

      - **Superseded claims**: what was believed, why it was wrong, what replaced it.

      - **Links out**: project-scoped material, linked and never copied.


      RULES:


      1. Every entry in "Verified facts" MUST name how it was verified. "The field
      exists" and "the values are usable" are different claims — conflating them is the
      most common way a plan goes wrong. If you have not checked, it belongs under
      "Unverified assumptions".


      2. Scope is CHANGE-SCOPED, not internal-vs-external. External research done to
      inform this change belongs here. Material spanning multiple changes belongs in the
      project's docs and is linked, never duplicated.


      3. Do NOT delete corrected claims. Move them to "Superseded claims" with the reason
      they were wrong.


      4. This artifact stays amendable after the proposal is written. Research continues
      during implementation, and findings that arrive mid-build belong in the record.
    requires: []
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.

      Ground it in research.md: cite verified facts rather than restating beliefs, and
      use the glossary's terms exactly.
    requires:
      - research
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal
  - id: architecture
    generates: architecture.md
    description: Technical architecture document with implementation details
    template: architecture.md
    instruction: >
      Create the architecture document that explains HOW to implement the
      change.


      When to include architecture.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this architecture achieves and explicitly
      excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good architecture docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: tests
    generates: tests.md
    description: Verification plan outlining automated and manual tests
    template: tests.md
    instruction: >
      Create the verification plan defining the automated regression tests and
      manual interaction test cases.

      Sections: - **Automated Tests**: Commands or scripts that run automated
      tests. - **Manual Verification**: Step-by-step developer actions to verify
      UI features, layout, and sounds.
    requires:
      - specs
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses

      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      Guidelines:

      - **TDD Requirement**: The very first task group (## 1) MUST be "Test
      Scaffolding (TDD)". You must outline writing and scaffolding failing tests
      for the target requirements BEFORE any implementation code is modified.

      - **Verification & Audit Requirement**: The final task group MUST be
      "Verification & Empirical Audit". It must outline running the full regression
      test suite, verifying pass counts, and generating/populating `verification.md`
      with the Requirement Adherence Audit Matrix, resolved assumptions, and
      execution logs.

      - Group related tasks under ## numbered headings

      - Each task MUST be a checkbox: `- [ ] X.Y Task description`

      - Tasks should be small enough to complete in one session

      - Order tasks by dependency (what must be done first?)


      Example:

      ```

      ## 1. Test Scaffolding (TDD)


      - [ ] 1.1 Write failing tests for data export

      - [ ] 1.2 Write failing tests for CSV formatting


      ## 2. Core Implementation


      - [ ] 2.1 Implement data export function

      - [ ] 2.2 Add CSV formatting utilities

      ```


      Reference specs for what needs to be built, design for how to build it.

      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - architecture
      - tests
  - id: verification
    generates: verification.md
    description: Empirical log of verifiable results proving the change adheres to specs and proposal
    template: verification.md
    instruction: >
      Create the verification document that records empirical proof that the implementation
      fulfills all requirements and scenarios defined in the specs and proposal.

      Sections:

      - **Executive Summary & Environment**: 1-2 sentence status summary, date verified,
        and test environment (OS, runner version, node/python interpreter).

      - **Requirement Adherence Audit Matrix**: Table mapping every capability requirement
        and scenario from `specs/` to its corresponding test file, test name, or empirical execution result.

      - **Resolved Assumptions & Empirical Proof**: Transition unverified assumptions from `research.md`
        into empirically verified facts with proof methods.

      - **Nomenclature & Code Symbol Audit**: Audit glossary terms from `research.md` against final code
        identifiers (classes, types, API routes) to ensure naming fidelity.

      - **Landed Tech Footprint & Patterns**: Document exact file paths and modules where adopted patterns
        and packages landed in the codebase.

      - **Invalidated Hypotheses & Mid-Build Adjustments**: Pre-coding beliefs from `research.md` or `architecture.md`
        that proved wrong during implementation, and what replaced them.

      - **Implementation-Discovered Deferrals**: Edge cases or scope items discovered during build that were
        intentionally deferred to future changes.

      - **Empirical Execution Logs & Evidence**: Verbatim command outputs, test runner results, and before/after metrics.

      - **Quick Re-Verification (60-Second Audit)**: Copy-pasteable shell commands and expected outputs so future
        developers can re-verify this feature against HEAD in under a minute.

      RULES:
      1. GUARD: You MUST NOT generate verification.md until implementation is complete. All checkboxes in `tasks.md` MUST be checked (`- [x]`). If any tasks are pending (`- [ ]`), refuse generation and prompt the user to complete implementation first.
      2. Every requirement scenario in `specs/` MUST be accounted for in the Requirement Adherence Audit Matrix.
      3. Include exact test commands and runner outputs, not general assertions.
      4. Report before/after metric deltas (e.g. record counts) to prove no data loss.
    requires:
      - tasks
      - specs
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: >
    Test-Driven Development (TDD) Guard: Work through tasks in order. You MUST
    complete the 'Test Scaffolding (TDD)' tasks (writing and verifying failing
    tests) before starting any implementation tasks. Run tests to confirm they
    fail initially, and continue running them to verify correctness during
    implementation.
